<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nice Weekend ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #fff0f6;
        }

        p {
        font-size: 22px;
        margin-top: 8px;
        }
        .card {
            text-align: center;
        }

        .heart {
            font-size: 100px;
            animation: beat 0.9s infinite;
        }

        h1 {
            font-size: 40px;
            margin-top: 15px;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="heart">❤️</div>
        <h1>Nice Weekend</h1>
        <p>I hope you have fun bungee jumping ❤️</p>
    </div>
</body>
</html>
