<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nice Weekend ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #fff0f6;
        }

        p {
        font-size: 22px;
        margin-top: 8px;
        }
        .card {
            text-align: center;
        }

        .heart {
            font-size: 100px;
            animation: beat 0.9s infinite;
        }
        .pdf-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #ff4d88;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
        }
        
        .pdf-button:hover {
            background: #e63e78;
        }

        h1 {
            font-size: 40px;
            margin-top: 15px;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="heart">❤️</div>
        <h1>Nice Weekend</h1>
        <p>I hope you have fun bungee jumping ❤️</p>
        <a href="SD30 PDS（最新）変更.pdf"
           download="SD30-PDS.pdf"
           class="pdf-button">
            Sika Japan Data Sheet
        </a>
    </div>
</body>
</html>
