<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Heart</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff0f4;
        }

        .heart {
            font-size: 120px;
            animation: beat 0.8s infinite;
        }

        @keyframes beat {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>

<div class="heart">❤️</div>

</body>
</html>
